# CozyHub Configuration

spawn:
  warmup-seconds: 3
  teleport-on-join: true
  reset-inventory-on-join: false

title:
  join-title: "&aWillkommen!"
  join-subtitle: "&7Schön dass du da bist, &f{player}"
  fade-in: 10
  stay: 60
  fade-out: 20
  show-actionbar: false
  actionbar-message: "&eWillkommen auf dem Server!"

starter-kit:
  items:
    - COMPASS
    - BREAD

protection:
  disable-pvp: true
  disable-damage: true
  disable-block-break: true
  disable-block-place: true
  disable-hunger: true
  hub-fly: true
  disable-item-drop: true
  disable-item-pickup: true
  disable-inventory-click: false

double-jump:
  enabled: true
  permission: "cozyhub.doublejump"
  velocity-x: 1.0
  velocity-y: 0.8
  particle: CLOUD
  sound: ENTITY_BAT_TAKEOFF
  cooldown-ticks: 0

hotbar:
  items:
    0:
      slot: 0
      material: COMPASS
      name: "&eServer wählen"
      lore:
        - "&7Rechtsklick zum Öffnen"
      action: OPEN_NAVIGATOR
      glow: true
    1:
      slot: 4
      material: ENDER_EYE
      name: "&bSpieler ausblenden"
      lore:
        - "&7Rechtsklick zum Umschalten"
      action: TOGGLE_VISIBILITY
      glow: false
    2:
      slot: 8
      material: BED
      name: "&cDisconnect"
      lore:
        - "&7Rechtsklick zum Verlassen"
      action: DISCONNECT
      glow: false

sidebar:
  enabled: true
  title: "&6&lCozy Network"
  update-interval: 20
  lines:
    - "&7"
    - "&fSpieler: &a{online}"
    - "&fWelt: &a{world}"
    - "&7"
    - "&fDein Rang: &a{rank}"
    - "&7"
    - "&ewww.example.net"

tablist:
  enabled: true
  update-interval: 40
  header:
    - "&6&lCozy Network"
    - "&7"
  footer:
    - "&7"
    - "&fOnline: &a{online}&7/&f{max}"
    - "&ewww.example.net"

visibility:
  default-hidden: false
  hotbar-slot: 8
  item-show:
    material: ENDER_EYE
    name: "&aSpieler einblenden"
  item-hide:
    material: ENDER_EYE
    name: "&cSpieler ausblenden"

cosmetics:
  join-firework:
    enabled: true
    power: 1
    colors:
      - RED
      - AQUA
    fade-colors:
      - WHITE
    type: BALL_LARGE
    trail: true
    flicker: false
  join-sound:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0

navigator:
  title: "&6Server Navigator"
  size: 27
  fill-material: GRAY_STAINED_GLASS_PANE

settings-gui:
  title: "&6Settings"
  size: 27
  fill-material: GRAY_STAINED_GLASS_PANE
  placeholders: {}

servers:
  survival:
    slot: 11
    name: "&aSurvival"
    material: GRASS_BLOCK
    lore:
      - "&7Klicke um zu verbinden"
    server: "survival"
    action: SERVER_CONNECT
  skyblock:
    slot: 13
    name: "&9Skyblock"
    material: END_STONE
    lore:
      - "&7Klicke um zu verbinden"
    server: "skyblock"
    action: SERVER_CONNECT
  creative:
    slot: 15
    name: "&bCreative"
    material: DIAMOND_BLOCK
    lore:
      - "&7Klicke um zu verbinden"
    server: "creative"
    action: SERVER_CONNECT
